<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff2a85">
  <meta name="description" content="Juego de Memorama PWA con temática Anime">
  <title>Anime Match - Memorama PWA</title>

  <!-- Manifiesto PWA -->
  <link rel="manifest" href="./manifest.json">

  <!-- Iconos y Estilos -->
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="game-header">
      <h1>🌸 ANIME MATCH 🌸</h1>
      <p class="subtitle">¡Encuentra todas las parejas ninja y mágicas!</p>
    </header>

    <!-- Panel de Estadísticas -->
    <section class="stats-panel" aria-label="Estadísticas del juego">
      <div class="stat-box">
        <span class="stat-label">⏱️ Tiempo</span>
        <span class="stat-value" id="timer">00:00</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">🎯 Movimientos</span>
        <span class="stat-value" id="moves">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">✨ Parejas</span>
        <span class="stat-value" id="pairs">0 / 8</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">🏆 Récord</span>
        <span class="stat-value" id="bestTime">--:--</span>
      </div>
    </section>

    <!-- Tablero de Juego -->
    <main class="game-board" id="gameBoard" aria-label="Tablero de cartas"></main>

    <!-- Controles -->
    <footer class="controls">
      <button id="btnRestart" class="btn btn-primary">🔄 Reiniciar Partida</button>
      <button id="btnInstall" class="btn btn-install" style="display: none;">📲 Instalar App</button>
    </footer>
  </div>

  <!-- Modal de Felicitación al Ganar -->
  <div id="winModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h2>🎉 ¡Sugoi! ¡Ganaste! 🎉</h2>
      <p>Completaste el desafío Anime Match.</p>
      <div class="modal-stats">
        <p><strong>Tiempo final:</strong> <span id="finalTime">00:00</span></p>
        <p><strong>Movimientos totales:</strong> <span id="finalMoves">0</span></p>
      </div>
      <button id="btnPlayAgain" class="btn btn-primary">⚡ Jugar de Nuevo</button>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
